name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      - name: Validate workflow configs
        run: for config in $(ls config.yaml examples/*/config.yaml 2>/dev/null); do biomero-template validate "$config" --biomero || exit 1; done
      - run: pytest
